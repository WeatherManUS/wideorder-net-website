name: Verify public release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Source commit/tag of the artifact to verify (use its original ref after a Hostinger rollback)
        required: false
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: wideorder-production-publication
  cancel-in-progress: true

jobs:
  publication:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out expected release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          persist-credentials: false
      - name: Use the repository Node.js baseline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Wait for Hostinger and confirm the public deployment
        run: node scripts/verify-publication.mjs
